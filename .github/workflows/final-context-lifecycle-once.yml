name: Final context lifecycle once

on:
  push:
    branches:
      - feature/jarvis-orchestration
    paths:
      - .final-context-lifecycle-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jarvis-orchestration
      - run: python3 scripts/final_context_lifecycle_patch.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/JarvisExecutionShadowHarness.cs
          git commit -m "Harden active orchestration context lifecycle"
          git push origin HEAD:feature/jarvis-orchestration
