name: One-shot current operator semantic consolidation

on:
  push:
    branches:
      - feature/jarvis-orchestration

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jarvis-orchestration
      - name: Replace lexical self-assignment with semantic marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_method(text, signature, replacement):
              start = text.find(signature)
              if start < 0:
                  raise RuntimeError('signature not found: ' + signature)
              brace = text.find('{', start)
              depth = 0
              in_string = False
              verbatim = False
              escape = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if in_string:
                      if verbatim:
                          if ch == '"':
                              if i + 1 < len(text) and text[i + 1] == '"':
                                  i += 2
                                  continue
                              in_string = False
                              verbatim = False
                      else:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == '"':
                              in_string = False
                  else:
                      if ch == '"':
                          in_string = True
                          verbatim = i > 0 and text[i - 1] == '@'
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return text[:start] + replacement.rstrip() + text[i + 1:]
                  i += 1
              raise RuntimeError('method close not found')

          p = Path('Core/JarvisPolicyRegistry.cs')
          text = p.read_text(encoding='utf-8-sig')
          old = '''            P("CRM.CURRENT_OPERATOR_IS_RUNTIME_CONTEXT", JarvisPolicyScope.Validation, JarvisPolicyEnforcement.Both,\n                "Όταν το semantic intent δηλώνει self-assignment/current operator, ο actor resolve γίνεται deterministic από το ενεργό Soft1 session user context και όχι με name lookup ή lexical patch.", agents: A("Echo", "Jarvis"), tasks: A("CreateCrmTask"), priority: 819),'''
          new = '''            P("CRM.CURRENT_OPERATOR_IS_RUNTIME_CONTEXT", JarvisPolicyScope.Validation, JarvisPolicyEnforcement.Both,\n                "Όταν το semantic intent δηλώνει self-assignment/current operator, το decomposition γράφει assignee=__CURRENT_OPERATOR__. Το runtime μετατρέπει μόνο αυτό το semantic marker deterministic στο ενεργό Soft1 UserId. Δεν χρησιμοποιούνται phrase lists, name lookup ή lexical patches για self-assignment.", agents: A("Echo", "Jarvis"), tasks: A("CreateCrmTask"), priority: 819),'''
          if old not in text:
              raise RuntimeError('CRM policy anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('Core/JarvisExecutionShadowHarness.cs')
          text = p.read_text(encoding='utf-8-sig')
          replacement = '''        private static void ResolveDeterministicRuntimeContext(JarvisShadowOrchestrationResult planning, XSupport xSupport)\n        {\n            if (planning == null || planning.Graph == null || xSupport == null || xSupport.ConnectionInfo == null) return;\n            int currentUserId = xSupport.ConnectionInfo.UserId;\n            if (currentUserId <= 0) return;\n\n            foreach (JarvisValidatedTaskNode node in planning.Graph.Nodes.Where(x => x != null && x.Descriptor != null))\n            {\n                JarvisPrerequisiteResolutionItem assignee = node.Prerequisites.FirstOrDefault(x => x != null && string.Equals(x.InputName, "assignee", StringComparison.OrdinalIgnoreCase));\n                if (assignee == null || assignee.Value == null ||\n                    !string.Equals(assignee.Value.ToString(), "__CURRENT_OPERATOR__", StringComparison.Ordinal))\n                    continue;\n\n                bool needsActor = false;\n                foreach (string toolName in node.Descriptor.Tools ?? new string[0])\n                {\n                    JarvisToolPrerequisiteDescriptor contract = JarvisToolRegistry.FindPrerequisites(toolName);\n                    if (contract == null) continue;\n                    foreach (string resolution in contract.ResolutionInputs ?? new string[0])\n                    {\n                        string token = resolution ?? string.Empty;\n                        if (token.IndexOf("actorUserId", StringComparison.OrdinalIgnoreCase) >= 0)\n                        {\n                            needsActor = true;\n                            break;\n                        }\n                    }\n                    if (needsActor) break;\n                }\n\n                if (!needsActor) continue;\n\n                SetResolvedRuntimeValue(node, "actorUserId", new JValue(currentUserId), "Current operator semantic marker resolved deterministically from the active Soft1 session.");\n                assignee.Value = new JValue(currentUserId);\n                assignee.Kind = JarvisPrerequisiteResolutionKind.ResolvedFromRouting;\n                assignee.Reason = "__CURRENT_OPERATOR__ resolved deterministically to the active Soft1 operator.";\n            }\n        }'''
          text = replace_method(text, '        private static void ResolveDeterministicRuntimeContext(', replacement)
          text = replace_method(text, '        private static bool RefersToCurrentOperator(', '')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/current-operator-semantic-once.yml
          git add Core/JarvisPolicyRegistry.cs Core/JarvisExecutionShadowHarness.cs
          git commit -m "Replace lexical self-assignment with semantic runtime marker"
          git push origin HEAD:feature/jarvis-orchestration
