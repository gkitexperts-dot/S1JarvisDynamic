name: Final architecture consolidation once

on:
  push:
    branches:
      - feature/jarvis-orchestration
    paths:
      - scripts/final_architecture_consolidation.py

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jarvis-orchestration
      - name: Apply final consolidation migration
        run: python3 scripts/final_architecture_consolidation.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No consolidation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/JarvisAgentClient.cs Core/JarvisControlledTaskExecutor.cs Core/JarvisControlledEchoTaskExecutor.cs Core/JarvisDatasetSession.cs Core/JarvisPolicyRegistry.cs Core/JarvisExecutionShadowHarness.cs UI/JarvisShell.OrchestrationShadow.cs
          git commit -m "Finish policy knowledge and active-context consolidation"
          git push origin HEAD:feature/jarvis-orchestration
