name: Final orchestration hardening once

on:
  push:
    branches:
      - feature/jarvis-orchestration
    paths:
      - .final-orchestration-hardening-trigger

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jarvis-orchestration
      - run: python3 scripts/apply_final_orchestration_hardening.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/JarvisTaskRegistry.cs Core/JarvisPolicyRegistry.cs Core/JarvisExecutionShadowHarness.cs Core/JarvisControlledExportTaskExecutor.cs Core/JarvisArchitectureRegressionAudit.cs
          git commit -m "Finish structured orchestration hardening"
          git push origin HEAD:feature/jarvis-orchestration
