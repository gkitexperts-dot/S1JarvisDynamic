name: AI routing policy

on:
  push:
    branches:
      - main
      - feature/jarvis-orchestration
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify startup-only AI routing policy
        run: python3 scripts/verify_ai_routing_policy.py
      - name: Verify centralized policy consolidation
        run: python3 scripts/verify_policy_consolidation.py
