name: Fix Responses latency regression

on:
  push:
    branches:
      - fix/native-s1-boot-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-s1-boot-verification
      - name: Patch Responses history and shadow latency
        shell: python
        run: |
          from pathlib import Path

          p = Path('Access/Verilic/JarvisDirectAiTransport.cs')
          s = p.read_text(encoding='utf-8')
          old = 'messageContent.Add(new JObject { ["type"] = "input_text", ["text"] = text });'
          new = 'messageContent.Add(new JObject { ["type"] = role == "assistant" ? "output_text" : "input_text", ["text"] = text });'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected one Responses text mapping, got {count}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('Core/JarvisOrchestrationShadowCoordinator.cs')
          s = p.read_text(encoding='utf-8')
          old = '''        internal static async Task RunAndLogSafeAsync(XSupport xSupport, string userPrompt)\n        {\n            try\n            {\n                await RunAsync(xSupport, userPrompt);\n            }\n            catch (Exception ex)\n            {\n                DebugLog.Log("[ORCH-SHADOW] UNHANDLED SUPPRESSED: " + ex);\n            }\n        }'''
          new = '''        internal static Task RunAndLogSafeAsync(XSupport xSupport, string userPrompt)\n        {\n            // Shadow orchestration is diagnostic-only and must never sit on the\n            // interactive chat critical path. Run it detached from the caller so\n            // a slow provider/decomposer cannot delay the real Atlas response.\n            return Task.Run(async () =>\n            {\n                try\n                {\n                    await RunAsync(xSupport, userPrompt).ConfigureAwait(false);\n                }\n                catch (Exception ex)\n                {\n                    DebugLog.Log("[ORCH-SHADOW] UNHANDLED SUPPRESSED: " + ex);\n                }\n            });\n        }'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected one shadow safe runner, got {count}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Access/Verilic/JarvisDirectAiTransport.cs Core/JarvisOrchestrationShadowCoordinator.cs
          git commit -m "Fix Responses history and shadow latency regression"
          git push origin HEAD:fix/native-s1-boot-verification