name: Harden controlled routing boundary

on:
  push:
    branches:
      - fix/native-s1-boot-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-s1-boot-verification
      - name: Enforce routing boundary inside harness
        shell: python
        run: |
          from pathlib import Path

          p = Path('Core/JarvisExecutionShadowHarness.cs')
          s = p.read_text(encoding='utf-8')
          old = '''        {\n            var outcome = new JarvisControlledPilotOutcome { Handled = false, Completed = false };\n            try\n            {\n                runtimeContext = runtimeContext ?? JarvisRuntimeContext.Capture(xSupport);'''
          new = '''        {\n            var outcome = new JarvisControlledPilotOutcome { Handled = false, Completed = false };\n\n            // The harness itself owns the rollout boundary. Callers may pre-gate\n            // for diagnostics/UI flow, but an accidental direct call must never\n            // create a second semantic provider request for ordinary conversation.\n            if (!ShouldAttemptControlledPilot(userPrompt, activeContext))\n            {\n                DebugLog.Log("[ORCH-CONTROL] skipped semantic planner at harness boundary.");\n                return outcome;\n            }\n\n            try\n            {\n                runtimeContext = runtimeContext ?? JarvisRuntimeContext.Capture(xSupport);'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected one TryRunControlledPilotAsync entry block, got {count}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Run routing policy check
        run: python scripts/verify_ai_routing_policy.py

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/JarvisExecutionShadowHarness.cs
          git commit -m "Enforce controlled planner boundary in harness"
          git push origin HEAD:fix/native-s1-boot-verification