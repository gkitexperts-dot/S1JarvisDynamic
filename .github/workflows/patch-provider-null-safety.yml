name: Patch provider null safety

on:
  push:
    branches:
      - fix/native-s1-boot-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-s1-boot-verification
      - name: Patch nullable provider response fields
        shell: python
        run: |
          from pathlib import Path
          p = Path('Access/Verilic/JarvisDirectAiTransport.cs')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'ReadInt(parsed["usage"]?["prompt_tokens"])': 'ReadNestedInt(parsed, "usage", "prompt_tokens")',
              'ReadInt(parsed["usage"]?["completion_tokens"])': 'ReadNestedInt(parsed, "usage", "completion_tokens")',
              'ReadInt(response["usage"]?["prompt_tokens"])': 'ReadNestedInt(response, "usage", "prompt_tokens")',
              'ReadInt(response["usage"]?["completion_tokens"])': 'ReadNestedInt(response, "usage", "completion_tokens")',
              'ReadInt(parsed["usageMetadata"]?["promptTokenCount"])': 'ReadNestedInt(parsed, "usageMetadata", "promptTokenCount")',
              'ReadInt(parsed["usageMetadata"]?["candidatesTokenCount"])': 'ReadNestedInt(parsed, "usageMetadata", "candidatesTokenCount")',
              'ReadInt(response["usageMetadata"]?["promptTokenCount"])': 'ReadNestedInt(response, "usageMetadata", "promptTokenCount")',
              'ReadInt(response["usageMetadata"]?["candidatesTokenCount"])': 'ReadNestedInt(response, "usageMetadata", "candidatesTokenCount")',
              'JArray parts = candidate?["content"]?["parts"] as JArray;': 'JObject candidateContent = candidate?["content"] as JObject;\n            JArray parts = candidateContent?["parts"] as JArray;'
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence, got {count}: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Access/Verilic/JarvisDirectAiTransport.cs
          git commit -m "Harden provider response null parsing"
          git push origin HEAD:fix/native-s1-boot-verification