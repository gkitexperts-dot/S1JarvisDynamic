name: Fix orchestration double call

on:
  push:
    branches:
      - fix/native-s1-boot-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-s1-boot-verification
      - name: Patch controlled-pilot routing
        shell: python
        run: |
          from pathlib import Path

          # 1) Remove the previous fire-and-forget workaround. The coordinator
          # keeps normal await semantics; the real fix belongs at the router gate.
          p = Path('Core/JarvisOrchestrationShadowCoordinator.cs')
          s = p.read_text(encoding='utf-8')
          old = '''        internal static Task RunAndLogSafeAsync(XSupport xSupport, string userPrompt)\n        {\n            // Shadow orchestration is diagnostic-only. Fire it independently and\n            // return a completed task so even an awaiting caller cannot put the\n            // decomposer/provider latency on the interactive chat critical path.\n            _ = Task.Run(async () =>\n            {\n                try\n                {\n                    await RunAsync(xSupport, userPrompt).ConfigureAwait(false);\n                }\n                catch (Exception ex)\n                {\n                    DebugLog.Log("[ORCH-SHADOW] UNHANDLED SUPPRESSED: " + ex);\n                }\n            });\n\n            return Task.CompletedTask;\n        }'''
          new = '''        internal static async Task RunAndLogSafeAsync(XSupport xSupport, string userPrompt)\n        {\n            try\n            {\n                await RunAsync(xSupport, userPrompt);\n            }\n            catch (Exception ex)\n            {\n                DebugLog.Log("[ORCH-SHADOW] UNHANDLED SUPPRESSED: " + ex);\n            }\n        }'''
          if old not in s:
              raise SystemExit('current shadow workaround block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Add an authoritative registry-driven pre-gate for the controlled
          # pilot. Unpromoted ordinary chat must not pay a second semantic AI call.
          p = Path('Core/JarvisExecutionShadowHarness.cs')
          s = p.read_text(encoding='utf-8')
          marker = '''        private static readonly HashSet<string> PromotedControlledTasks = new HashSet<string>(\n            new[] { "ReportData", "ExportData", "SendEmail", "CreateCrmTask", "CreateCalendarEvent" },\n            StringComparer.OrdinalIgnoreCase);\n'''
          insert = marker + '''\n        internal static bool ShouldAttemptControlledPilot(\n            string userPrompt,\n            JarvisActiveOrchestrationContext activeContext = null)\n        {\n            // An open Jarvis-owned run is always eligible for continuation.\n            if (activeContext != null && activeContext.HasOpenRun)\n                return true;\n\n            if (string.IsNullOrWhiteSpace(userPrompt))\n                return false;\n\n            // The rollout boundary is the promoted task set itself. Use the\n            // authoritative task registry's IntentHints to decide whether the\n            // controlled planner should run at all. This avoids a second provider\n            // call for ordinary conversation while keeping task capability truth\n            // in JarvisTaskRegistry rather than in UI/private keyword tables.\n            string prompt = userPrompt.Trim();\n            foreach (string taskType in PromotedControlledTasks)\n            {\n                JarvisTaskDescriptor descriptor = JarvisTaskRegistry.Find(taskType);\n                if (descriptor == null)\n                    continue;\n\n                foreach (string hint in descriptor.IntentHints ?? new string[0])\n                {\n                    if (!string.IsNullOrWhiteSpace(hint) &&\n                        prompt.IndexOf(hint.Trim(), StringComparison.OrdinalIgnoreCase) >= 0)\n                        return true;\n                }\n            }\n\n            return false;\n        }\n'''
          if marker not in s:
              raise SystemExit('promoted task marker not found')
          s = s.replace(marker, insert, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Gate the controlled planner before invoking the semantic decomposer.
          p = Path('UI/JarvisShell.OrchestrationShadow.cs')
          s = p.read_text(encoding='utf-8')
          old = '''                JarvisControlledPilotOutcome pilot = await JarvisExecutionShadowHarness.TryRunControlledPilotAsync(\n                    _xSupport, userText, _orchestrationPendingConfirmation, _orchestrationDatasetSession,\n                    _orchestrationActiveContext, _orchestrationSessionContext);\n                if (pilot != null && pilot.Handled)\n                {\n                    if (!string.IsNullOrWhiteSpace(pilot.UserMessage))\n                        PostMainChatPresentation(pilot.UserMessage);\n                    return;\n                }'''
          new = '''                JarvisControlledPilotOutcome pilot = null;\n                if (JarvisExecutionShadowHarness.ShouldAttemptControlledPilot(\n                    userText, _orchestrationActiveContext))\n                {\n                    pilot = await JarvisExecutionShadowHarness.TryRunControlledPilotAsync(\n                        _xSupport, userText, _orchestrationPendingConfirmation, _orchestrationDatasetSession,\n                        _orchestrationActiveContext, _orchestrationSessionContext);\n                }\n                else\n                {\n                    DebugLog.Log("[ORCH-CONTROL] skipped semantic planner: no promoted task intent hint.");\n                }\n\n                if (pilot != null && pilot.Handled)\n                {\n                    if (!string.IsNullOrWhiteSpace(pilot.UserMessage))\n                        PostMainChatPresentation(pilot.UserMessage);\n                    return;\n                }'''
          if old not in s:
              raise SystemExit('primary controlled pilot call block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/JarvisOrchestrationShadowCoordinator.cs Core/JarvisExecutionShadowHarness.cs UI/JarvisShell.OrchestrationShadow.cs
          git commit -m "Gate controlled orchestration before semantic planning"
          git push origin HEAD:fix/native-s1-boot-verification