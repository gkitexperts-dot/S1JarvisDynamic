name: Structured export bindings once

on:
  push:
    branches:
      - feature/jarvis-orchestration
    paths:
      - .structured-export-bindings-trigger

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jarvis-orchestration
      - run: python3 scripts/apply_structured_export_bindings.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/JarvisTaskRegistry.cs Core/JarvisPrerequisiteResolution.cs Core/JarvisPolicyRegistry.cs Core/JarvisControlledTaskExecutor.cs Core/JarvisControlledExportTaskExecutor.cs Core/JarvisExecutionShadowHarness.cs Core/JarvisDocumentScopeValidator.cs Core/JarvisArchitectureRegressionAudit.cs
          git commit -m "Make export autonomous with structured semantic bindings"
          git push origin HEAD:feature/jarvis-orchestration
