name: remove-dr-model-placeholder
on:
  push:
    branches: [feature/jarvis-orchestration]
    paths: [.github/workflows/one-shot-remove-dr-model-placeholder.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jarvis-orchestration
          fetch-depth: 0
      - run: python3 scripts/one_shot_remove_server_authoritative.py
      - run: python3 scripts/verify_ai_routing_policy.py
      - run: |
          rm -f scripts/one_shot_remove_server_authoritative.py
          rm -f .github/workflows/one-shot-remove-dr-model-placeholder.yml
          git config user.name "Jarvis Architecture Bot"
          git config user.email "jarvis-architecture@users.noreply.github.com"
          git add -A
          git commit -m "Remove final runtime model placeholder"
          git push origin HEAD:feature/jarvis-orchestration
