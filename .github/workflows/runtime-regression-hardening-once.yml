name: Runtime regression hardening once

on:
  push:
    branches:
      - feature/jarvis-orchestration
    paths:
      - .runtime-regression-hardening-trigger

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jarvis-orchestration
      - run: python3 scripts/apply_runtime_regression_hardening.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/JarvisIntentOrchestration.cs Core/JarvisOrchestrationShadowCoordinator.cs Core/JarvisTaskRegistry.cs Core/JarvisPrerequisiteResolution.cs Core/JarvisDependencyBinding.cs Core/JarvisPolicyRegistry.cs Core/JarvisControlledTaskExecutor.cs Core/JarvisDatasetSession.cs UI/JarvisShell.OrchestrationShadow.cs Core/JarvisExecutionShadowHarness.cs Core/JarvisArchitectureRegressionAudit.cs
          git commit -m "Harden runtime context dataset export and report validation"
          git push origin HEAD:feature/jarvis-orchestration
