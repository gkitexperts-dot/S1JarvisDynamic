name: Fix conversation classification

on:
  push:
    branches:
      - fix/native-s1-boot-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-s1-boot-verification
      - name: Repair exact conversational intent precedence
        shell: python
        run: |
          from pathlib import Path

          p = Path('Access/Verilic/VerilicProviderRequestOptimizer.cs')
          s = p.read_text(encoding='utf-8-sig')
          old = '''        private static bool IsClearlyConversational(string text)\n        {\n            if (string.IsNullOrWhiteSpace(text)) return false;\n            string n = NormalizeGreek(text).Trim().TrimEnd('?', '!', '.').Trim();\n            if (n.Length == 0 || n.Length > 80) return false;\n            if (ContainsAnyNormalized(n, BusinessSignals) ||\n                ContainsAnyNormalized(n, ReadSignals) ||\n                ContainsAnyNormalized(n, ActionSignals)) return false;\n            foreach (string phrase in ConversationalExact)\n            {\n                string p = NormalizeGreek(phrase).Trim().TrimEnd('?', '!', '.').Trim();\n                if (string.Equals(n, p, StringComparison.Ordinal)) return true;\n            }\n            return n.StartsWith("γεια ", StringComparison.Ordinal) ||\n                   n.StartsWith("καλημερα ", StringComparison.Ordinal) ||\n                   n.StartsWith("καλησπερα ", StringComparison.Ordinal) ||\n                   n.StartsWith("ευχαριστω ", StringComparison.Ordinal);\n        }'''
          new = '''        private static bool IsClearlyConversational(string text)\n        {\n            if (string.IsNullOrWhiteSpace(text)) return false;\n            string n = NormalizeGreek(text).Trim().TrimEnd('?', '!', '.').Trim();\n            if (n.Length == 0 || n.Length > 80) return false;\n\n            // Exact conversational intents are authoritative and must be checked\n            // before broad substring signal families. Otherwise "ποιος εισαι"\n            // falsely matches the read signal "ποιο" and is routed as atlas-read,\n            // attaching business tools and turning a trivial identity turn into a\n            // heavyweight provider request.\n            foreach (string phrase in ConversationalExact)\n            {\n                string p = NormalizeGreek(phrase).Trim().TrimEnd('?', '!', '.').Trim();\n                if (string.Equals(n, p, StringComparison.Ordinal)) return true;\n            }\n\n            if (ContainsAnyNormalized(n, BusinessSignals) ||\n                ContainsAnyNormalized(n, ReadSignals) ||\n                ContainsAnyNormalized(n, ActionSignals)) return false;\n\n            return n.StartsWith("γεια ", StringComparison.Ordinal) ||\n                   n.StartsWith("καλημερα ", StringComparison.Ordinal) ||\n                   n.StartsWith("καλησπερα ", StringComparison.Ordinal) ||\n                   n.StartsWith("ευχαριστω ", StringComparison.Ordinal);\n        }'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected one IsClearlyConversational block, got {count}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8-sig')

          # Static regression guards for the exact bug seen live.
          text = p.read_text(encoding='utf-8-sig')
          exact_pos = text.index('foreach (string phrase in ConversationalExact)', text.index('private static bool IsClearlyConversational'))
          signals_pos = text.index('ContainsAnyNormalized(n, BusinessSignals)', text.index('private static bool IsClearlyConversational'))
          if exact_pos >= signals_pos:
              raise SystemExit('regression: exact conversational intents no longer precede broad signals')
          if '"ποιος εισαι"' not in text or '"ποιος εισαι;"' not in text:
              raise SystemExit('regression: identity intents missing from ConversationalExact')
      - name: Run repository guards
        run: |
          python3 scripts/verify_ai_routing_policy.py
          python3 scripts/verify_policy_consolidation.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Access/Verilic/VerilicProviderRequestOptimizer.cs
          git commit -m "Fix exact conversation intent classification"
          git push origin HEAD:fix/native-s1-boot-verification