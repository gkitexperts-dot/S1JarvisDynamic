name: Final optimizer policy cleanup once

on:
  push:
    branches:
      - feature/jarvis-orchestration
    paths:
      - .final-optimizer-policy-cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jarvis-orchestration
      - run: python3 scripts/final_optimizer_policy_cleanup.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Access/Verilic/VerilicProviderRequestOptimizer.cs Core/JarvisPolicyRegistry.cs
          git commit -m "Remove remaining optimizer policy copies"
          git push origin HEAD:feature/jarvis-orchestration
