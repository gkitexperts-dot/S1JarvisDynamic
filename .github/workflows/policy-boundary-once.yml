name: One-shot policy boundary integration

on:
  push:
    branches:
      - feature/jarvis-orchestration

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jarvis-orchestration
      - name: Inject centralized policies after optimizer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Access/Verilic/VerilicAiMessagesClient.cs')
          text = p.read_text(encoding='utf-8-sig')
          old = '''                providerRequestJson = ApplyProductIdentityPolicy(\n                    agentName,\n                    providerRequestJson);'''
          new = '''                providerRequestJson = ApplyProductIdentityPolicy(\n                    agentName,\n                    providerRequestJson);\n\n                // Last-mile centralized policy injection must run AFTER the legacy\n                // optimizer because compact modes may replace the system envelope.\n                // Every logical agent therefore reaches the provider with the\n                // authoritative policy context resolved from registries.\n                providerRequestJson = JarvisPolicyRequestEnricher.Apply(\n                    agentName,\n                    providerRequestJson);'''
          if old not in text:
              raise SystemExit('policy boundary anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/policy-boundary-once.yml
          git add Access/Verilic/VerilicAiMessagesClient.cs
          git commit -m "Enforce centralized policy context at provider boundary"
          git push origin HEAD:feature/jarvis-orchestration
