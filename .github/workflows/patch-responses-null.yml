name: Patch Responses null normalization

on:
  push:
    branches:
      - fix/native-s1-boot-verification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-s1-boot-verification
      - name: Patch nullable Responses fields
        shell: python
        run: |
          from pathlib import Path
          p = Path('Access/Verilic/JarvisDirectAiTransport.cs')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'string incomplete = (string)response["incomplete_details"]?["reason"];': 'JObject incompleteDetails = response["incomplete_details"] as JObject;\n            string incomplete = incompleteDetails == null ? string.Empty : (string)incompleteDetails["reason"];',
              'ReadInt(parsed["usage"]?["input_tokens"]),\n                        ReadInt(parsed["usage"]?["output_tokens"]))': 'ReadNestedInt(parsed, "usage", "input_tokens"),\n                        ReadNestedInt(parsed, "usage", "output_tokens"))',
              'ReadInt(response["usage"]?["input_tokens"]),\n                    ["output_tokens"] = ReadInt(response["usage"]?["output_tokens"])': 'ReadNestedInt(response, "usage", "input_tokens"),\n                    ["output_tokens"] = ReadNestedInt(response, "usage", "output_tokens")'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('expected pattern not found: ' + old[:80])
              s = s.replace(old, new)
          marker = '        private static int ReadInt(JToken token)'
          helper = '''        private static int ReadNestedInt(JObject parent, string objectName, string valueName)\n        {\n            JObject nested = parent == null ? null : parent[objectName] as JObject;\n            return nested == null ? 0 : ReadInt(nested[valueName]);\n        }\n\n'''
          if marker not in s:
              raise SystemExit('ReadInt marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Access/Verilic/JarvisDirectAiTransport.cs
          git commit -m "Handle nullable OpenAI Responses fields safely"
          git push origin HEAD:fix/native-s1-boot-verification
